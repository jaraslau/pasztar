<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pasztar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <section class="panel clients-panel">
          <div class="section-head">
            <h2>Clients</h2>
            <button id="refresh-clients" type="button" class="icon-button" title="Refresh">
              Refresh
            </button>
          </div>
          <p id="app-status" class="status"></p>
          <div id="clients" class="clients"></div>
        </section>
      </aside>

      <section class="chat">
        <header class="chat-head">
          <div>
            <p class="eyebrow">Direct messages</p>
            <h2 id="chat-title">Select a client</h2>
          </div>
          <div class="actions">
            <button id="export-identity" type="button" class="secondary">Export</button>
            <button id="refresh-messages" type="button" class="secondary">Fetch</button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="message-form" class="composer">
          <textarea id="message-text" rows="3" placeholder="Message" required></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <template id="client-template">
      <button class="client" type="button">
        <span class="client-name"></span>
        <span class="client-id"></span>
      </button>
    </template>

    <script src="/app.js"></script>
  </body>
</html>

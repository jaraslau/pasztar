<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pasztar - arcana</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true">
      <symbol id="icon-cog" viewBox="0 0 24 24">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
        <path
          d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.08 1.65V21a2.1 2.1 0 0 1-4.2 0v-.09a1.8 1.8 0 0 0-1.17-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06a2.1 2.1 0 0 1-2.97-2.97l.06-.06a1.8 1.8 0 0 0 .36-1.98 1.8 1.8 0 0 0-1.65-1.08H3a2.1 2.1 0 0 1 0-4.2h.09a1.8 1.8 0 0 0 1.65-1.17 1.8 1.8 0 0 0-.36-1.98l-.06-.06a2.1 2.1 0 1 1 2.97-2.97l.06.06a1.8 1.8 0 0 0 1.98.36h.09A1.8 1.8 0 0 0 10.5 3V3a2.1 2.1 0 0 1 4.2 0v.09a1.8 1.8 0 0 0 1.08 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 1.98v.09A1.8 1.8 0 0 0 21 10.5H21a2.1 2.1 0 0 1 0 4.2h-.09A1.8 1.8 0 0 0 19.4 15Z"
        />
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 0 1-14.93 4" />
        <path d="M4 12A8 8 0 0 1 18.93 8" />
        <path d="M18 3v5h-5" />
        <path d="M6 21v-5h5" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4 20-7Z" />
        <path d="M22 2 11 13" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <path d="M12 19v3" />
        <path d="M8 22h8" />
      </symbol>
      <symbol id="icon-image" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 15 5-5 4 4 2-2 7 7" />
        <path d="M14 9h.01" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
        <path d="M14 2v6h6" />
      </symbol>
      <symbol id="icon-video" viewBox="0 0 24 24">
        <path d="M15 10l5-3v10l-5-3Z" />
        <rect x="3" y="6" width="12" height="12" rx="2" />
      </symbol>
      <symbol id="icon-video-off" viewBox="0 0 24 24">
        <path d="M3 3l18 18" />
        <path d="M10.5 6H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 1.7-.9" />
        <path d="M15 10l5-3v9.5" />
      </symbol>
      <symbol id="icon-phone-off" viewBox="0 0 24 24">
        <path d="M3 3l18 18" />
        <path
          d="M14.5 14.5 17 12l4 4-3 3c-5.5-.5-10.5-5.5-11-11l3-3 4 4-2.5 2.5"
        />
      </symbol>
      <symbol id="icon-minimize" viewBox="0 0 24 24">
        <path d="M8 3v5H3" />
        <path d="M21 8h-5V3" />
        <path d="M3 16h5v5" />
        <path d="M16 21v-5h5" />
      </symbol>
      <symbol id="icon-maximize" viewBox="0 0 24 24">
        <path d="M3 8V3h5" />
        <path d="M16 3h5v5" />
        <path d="M8 21H3v-5" />
        <path d="M21 16v5h-5" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7V5Z" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M8 5v14" />
        <path d="M16 5v14" />
      </symbol>
      <symbol id="icon-rewind" viewBox="0 0 24 24">
        <path d="m11 19-8-7 8-7v14Z" />
        <path d="m21 19-8-7 8-7v14Z" />
      </symbol>
      <symbol id="icon-forward" viewBox="0 0 24 24">
        <path d="m13 5 8 7-8 7V5Z" />
        <path d="m3 5 8 7-8 7V5Z" />
      </symbol>
      <symbol id="icon-reply" viewBox="0 0 24 24">
        <path d="m9 17-6-5 6-5" />
        <path d="M3 12h12a6 6 0 0 1 6 6v1" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 15H6L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
      </symbol>
      <symbol id="icon-select" viewBox="0 0 24 24">
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="m12 19-7-7 7-7" />
      </symbol>
    </svg>

    <main class="shell">
      <aside class="sidebar">
        <section class="panel clients-panel">
          <div class="section-head">
            <h2>Clients</h2>
            <button
              id="refresh-clients"
              type="button"
              class="icon-button"
              title="Refresh clients"
              aria-label="Refresh clients"
            >
              <svg class="icon"><use href="#icon-refresh"></use></svg>
            </button>
          </div>
          <div
            id="clients-forwarding-bar"
            class="clients-forwarding-bar"
            hidden
          >
            <span id="clients-forwarding-count" class="forwarding-count"></span>
            <button
              id="cancel-forwarding-clients"
              type="button"
              class="secondary clients-forwarding-cancel"
              title="Cancel forwarding"
              aria-label="Cancel forwarding"
            >
              <svg class="icon"><use href="#icon-x"></use></svg>
              Cancel
            </button>
          </div>
          <p id="app-status" class="status"></p>
          <div id="clients" class="clients"></div>
        </section>
      </aside>

      <section class="chat">
        <header class="chat-head">
          <button
            id="back-to-clients"
            type="button"
            class="icon-button back-to-clients"
            title="Back to clients"
            aria-label="Back to clients"
          >
            <svg class="icon"><use href="#icon-arrow-left"></use></svg>
          </button>
          <div>
            <p class="eyebrow">Direct messages</p>
            <h2 id="chat-title">Select a client</h2>
          </div>
          <div class="actions">
            <button
              id="start-call"
              type="button"
              class="icon-button"
              title="Start call"
              aria-label="Start call"
              disabled
            >
              <svg class="icon"><use href="#icon-video"></use></svg>
            </button>
            <button
              id="open-settings"
              type="button"
              class="icon-button"
              title="Settings"
              aria-label="Settings"
            >
              <svg class="icon"><use href="#icon-cog"></use></svg>
            </button>
          </div>
        </header>

        <section id="call-panel" class="call-panel" hidden>
          <div class="call-stage">
            <video
              id="remote-video"
              class="remote-video"
              autoplay
              playsinline
            ></video>
            <video
              id="local-video"
              class="local-video"
              autoplay
              muted
              playsinline
            ></video>
            <div id="remote-placeholder" class="remote-placeholder"></div>
            <span id="remote-muted" class="call-badge" hidden>Muted</span>
            <span id="local-muted" class="call-badge local-badge" hidden
              >You muted</span
            >
          </div>
          <div class="call-controls">
            <div class="call-copy">
              <span id="call-status" class="call-status"></span>
              <span id="call-flags" class="call-flags"></span>
            </div>
            <div class="call-actions">
              <button id="accept-call" type="button" class="secondary">
                <svg class="icon"><use href="#icon-video"></use></svg>
                Join
              </button>
              <button
                id="decline-call"
                type="button"
                class="icon-button"
                title="Decline call"
                aria-label="Decline call"
              >
                <svg class="icon"><use href="#icon-x"></use></svg>
              </button>
              <button
                id="mute-call"
                type="button"
                class="icon-button"
                title="Mute microphone"
                aria-label="Mute microphone"
              >
                <svg class="icon"><use href="#icon-mic"></use></svg>
              </button>
              <button
                id="camera-call"
                type="button"
                class="icon-button"
                title="Turn camera off"
                aria-label="Turn camera off"
              >
                <svg class="icon"><use href="#icon-video"></use></svg>
              </button>
              <button
                id="toggle-call-size"
                type="button"
                class="icon-button"
                title="Shrink call"
                aria-label="Shrink call"
              >
                <svg class="icon"><use href="#icon-minimize"></use></svg>
              </button>
              <button
                id="leave-call"
                type="button"
                class="icon-button danger-button"
                title="Leave call"
                aria-label="Leave call"
              >
                <svg class="icon"><use href="#icon-phone-off"></use></svg>
              </button>
            </div>
          </div>
        </section>

        <div id="messages" class="messages"></div>

        <div id="forwarding-bar" class="forwarding-bar" hidden>
          <span id="forwarding-count" class="forwarding-count"></span>
          <button
            id="cancel-forwarding"
            type="button"
            class="icon-button"
            title="Cancel forwarding"
            aria-label="Cancel forwarding"
          >
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
        </div>

        <form id="message-form" class="composer">
          <div id="reply-preview" class="reply-preview" hidden>
            <div>
              <span class="reply-label">Replying to</span>
              <p id="reply-preview-text"></p>
            </div>
            <button
              id="cancel-reply"
              type="button"
              class="icon-button"
              title="Cancel reply"
              aria-label="Cancel reply"
            >
              <svg class="icon"><use href="#icon-x"></use></svg>
            </button>
          </div>
          <div id="voice-controls" class="voice-controls" hidden>
            <span id="voice-timer" class="voice-timer">0:00</span>
            <button
              id="cancel-voice"
              type="button"
              class="icon-button"
              title="Cancel voice message"
              aria-label="Cancel voice message"
            >
              <svg class="icon"><use href="#icon-x"></use></svg>
            </button>
            <button
              id="send-voice"
              type="button"
              class="send-button"
              title="Send voice message"
              aria-label="Send voice message"
            >
              <svg class="icon"><use href="#icon-send"></use></svg>
            </button>
          </div>
          <textarea
            id="message-text"
            rows="3"
            placeholder="Message"
            required
          ></textarea>
          <button
            id="send-text"
            type="submit"
            class="send-button"
            title="Send"
            aria-label="Send"
            hidden
          >
            <svg class="icon"><use href="#icon-send"></use></svg>
          </button>
          <div class="attachment-picker">
            <button
              id="open-attachments"
              type="button"
              class="send-button attachment-button"
              title="Attachments"
              aria-label="Attachments"
              aria-expanded="false"
            >
              <svg class="icon"><use href="#icon-plus"></use></svg>
            </button>
            <div id="attachment-menu" class="attachment-menu" hidden>
              <button
                id="record-voice"
                type="button"
                class="icon-button"
                title="Record voice"
                aria-label="Record voice"
              >
                <svg class="icon"><use href="#icon-mic"></use></svg>
              </button>
              <button
                id="pick-image"
                type="button"
                class="icon-button"
                title="Send image"
                aria-label="Send image"
              >
                <svg class="icon"><use href="#icon-image"></use></svg>
              </button>
              <button
                id="pick-file"
                type="button"
                class="icon-button"
                title="Send file"
                aria-label="Send file"
              >
                <svg class="icon"><use href="#icon-file"></use></svg>
              </button>
            </div>
            <input id="image-input" type="file" accept="image/*" hidden />
            <input id="file-input" type="file" hidden />
          </div>
        </form>
        <div id="selection-bar" class="selection-bar" hidden>
          <button
            id="cancel-selection"
            type="button"
            class="icon-button"
            title="Cancel selection"
            aria-label="Cancel selection"
          >
            <svg class="icon"><use href="#icon-x"></use></svg>
          </button>
          <span id="selection-count" class="selection-count">0 selected</span>
          <div class="selection-actions">
            <button
              id="forward-selected"
              type="button"
              class="icon-button"
              title="Forward selected"
              aria-label="Forward selected"
              disabled
            >
              <svg class="icon"><use href="#icon-forward"></use></svg>
            </button>
            <button
              id="delete-selected"
              type="button"
              class="icon-button danger-button"
              title="Delete selected"
              aria-label="Delete selected"
            >
              <svg class="icon"><use href="#icon-trash"></use></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <dialog id="settings-modal" class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button
          id="close-settings"
          type="button"
          class="icon-button"
          title="Close"
          aria-label="Close"
        >
          <svg class="icon"><use href="#icon-x"></use></svg>
        </button>
      </div>
      <p id="identity-summary" class="status"></p>
      <div class="media-inputs">
        <label>
          Microphone
          <select id="audio-input"></select>
        </label>
        <label>
          Camera
          <select id="video-input"></select>
        </label>
      </div>
      <div class="modal-actions">
        <button id="export-identity" type="button" class="secondary">
          <svg class="icon"><use href="#icon-download"></use></svg>
          Export identity
        </button>
        <button id="reset-identity" type="button" class="danger-button">
          Reset local identity
        </button>
      </div>
    </dialog>

    <template id="client-template">
      <button class="client" type="button">
        <span class="client-copy">
          <span class="client-name"></span>
          <span class="client-id"></span>
        </span>
        <span class="client-status">
          <span class="client-status-dot"></span>
        </span>
      </button>
    </template>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>

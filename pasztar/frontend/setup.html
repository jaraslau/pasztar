<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pasztar setup</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="setup-page">
    <main class="setup-screen">
      <form id="identity-form" class="setup-panel stack">
        <img class="setup-logo" src="/assets/pasztar.png" alt="pasztar" />
        <h1>pasztar / arcana</h1>
        <label>
          Client ID
          <input
            id="client-id"
            name="client-id"
            autocomplete="username"
            required
          />
        </label>
        <label>
          Display name
          <input
            id="display-name"
            name="display-name"
            autocomplete="name"
            required
          />
        </label>
        <label id="admission-field" hidden>
          Bootstrap or invitation token
          <input
            id="admission-token"
            name="admission-token"
            type="password"
            autocomplete="off"
            maxlength="512"
            aria-describedby="admission-help"
          />
        </label>
        <p id="admission-help" class="status" aria-live="polite"></p>
        <button id="register" type="submit" disabled>Register</button>
        <p id="setup-status" class="status" role="status"></p>
        <div class="splitter"></div>
        <label>
          Identity bundle
          <input
            id="identity-import"
            type="file"
            accept="application/json,.json"
          />
        </label>
      </form>
    </main>

    <script type="module" src="/static/js/setup.js"></script>
  </body>
</html>

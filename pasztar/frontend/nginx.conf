limit_req_zone $binary_remote_addr zone=api:10m rate=${API_REQUEST_RATE};
map $request_method $registration_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $registration_key zone=registration:1m rate=${REGISTRATION_REQUEST_RATE};
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size ${API_MAX_BODY_BYTES};
    client_body_timeout ${CLIENT_BODY_TIMEOUT_SECONDS}s;
    limit_req zone=api burst=${API_REQUEST_BURST} nodelay;
    limit_req_status 429;
    limit_conn connections ${API_CONNECTIONS_PER_IP};
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: stun: turn: turns:" always;

    location /api/ {
        proxy_pass http://api:${APP_PORT}/;
    }

    location = /api/clients {
        limit_req zone=api burst=${API_REQUEST_BURST} nodelay;
        limit_req zone=registration burst=${REGISTRATION_REQUEST_BURST} nodelay;
        proxy_pass http://api:${APP_PORT}/clients;
    }

    location = /api/messages {
        client_max_body_size ${MESSAGE_MAX_BODY_BYTES};
        proxy_pass http://api:${APP_PORT}/messages;
    }

    location = /api/events {
        proxy_buffering off;
        proxy_read_timeout ${EVENT_PROXY_TIMEOUT_SECONDS}s;
        proxy_pass http://api:${APP_PORT}/events;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

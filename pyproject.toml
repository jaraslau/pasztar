[tool.poetry]
name = "pasztar"
version = "0.1.0"
description = "VPN-local encrypted message node"
authors = ["jaraslau"]
readme = "readme"
packages = [{ include = "pasztar" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
alembic = "^1.13.0"
cryptography = "^43.0.0"
fastapi = "^0.115.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pydantic = "^2.8.0"
sqlalchemy = "^2.0.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

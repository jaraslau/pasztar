services:
  api:
    build:
      context: .
      dockerfile: dockerfile.backend
    env_file:
      - .env
    ports:
      - "${API_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api

  turn:
    image: coturn/coturn:latest
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_PORT_MIN}
      - --max-port=${TURN_RELAY_PORT_MAX}
      - --external-ip=${TURN_EXTERNAL_IP}
    ports:
      - "${TURN_PORT}:3478/tcp"
      - "${TURN_PORT}:3478/udp"
      - "${TURN_RELAY_PORT_MIN}-${TURN_RELAY_PORT_MAX}:${TURN_RELAY_PORT_MIN}-${TURN_RELAY_PORT_MAX}/udp"

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pasztar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pasztar-postgres:

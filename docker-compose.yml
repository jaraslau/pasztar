services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - "${API_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./pasztar/frontend
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pasztar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pasztar-postgres:
